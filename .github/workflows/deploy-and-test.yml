name: Deploy App And Run E2E Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-framework:
    name: Build Test Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  deploy-app:
    name: Deploy SuperHero App
    runs-on: ubuntu-latest
    needs: build-test-framework
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static app artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: superHeroApp-master

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e-tests:
    name: Run WDIO Tests Against Deployed App
    runs-on: ubuntu-latest
    needs: deploy-app
    if: github.event_name != 'pull_request'

    env:
      APP_BASE_URL: ${{ needs.deploy-app.outputs.page_url }}
      USER_NAME: ${{ secrets.USER_NAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      INVALID_USER_NAME: ${{ secrets.INVALID_USER_NAME }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
      PASSWORD_UPPER_CASE: ${{ secrets.PASSWORD_UPPER_CASE }}
      MISSING_EMAIL_PASSWORD: ${{ secrets.MISSING_EMAIL_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run WDIO suite
        run: npx wdio run ./dist/wdio.conf.js

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenShots
          if-no-files-found: ignore
